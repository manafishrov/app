pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{ts,tsx}'
      run: bunx oxlint --fix --type-aware --type-check {staged_files} && git add {staged_files}
    fmt:
      glob: '*.{ts,tsx}'
      run: bunx oxfmt {staged_files} && git add {staged_files}
    lint-rs:
      glob: '*.rs'
      run: cargo clippy --manifest-path src-tauri/Cargo.toml --fix --allow-dirty -- -W clippy::all && git add {staged_files}
    fmt-rs:
      glob: '*.rs'
      run: cargo fmt --manifest-path src-tauri/Cargo.toml && git add {staged_files}
