<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme') || 'system';
          var isDark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      html {
        border-radius: calc(0.325rem + 4px);
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.2rem;
        background: oklch(1 0 0);
        color: oklch(0.141 0.005 285.823);
        -webkit-user-select: none;
        user-select: none;
      }
      .dark body {
        background: oklch(0.141 0.005 285.823);
        color: oklch(0.985 0 0);
      }

      svg {
        width: 64px;
        height: 64px;
        opacity: 0;
        animation: logo-in 0.6s ease-out 0.1s forwards;
      }

      .bar-track {
        width: 196px;
        height: 3px;
        border-radius: 2px;
        background: oklch(0.92 0.004 286.32);
        overflow: hidden;
        opacity: 0;
        animation: logo-in 0.5s ease-out 0.4s forwards;
      }
      .dark .bar-track {
        background: oklch(1 0 0 / 10%);
      }

      .bar-fill {
        height: 100%;
        border-radius: 2px;
        background: oklch(0.623 0.214 259.815);
        animation: bar 2s ease-in-out infinite;
      }
      .dark .bar-fill {
        background: oklch(0.546 0.245 262.881);
      }

      @keyframes logo-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes bar {
        0% {
          width: 0%;
          margin-left: 0%;
        }
        50% {
          width: 60%;
          margin-left: 20%;
        }
        100% {
          width: 0%;
          margin-left: 100%;
        }
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M512 833.4L166.2 633.7L166.2 234.3L512 34.6L857.8 234.3L857.8 633.7ZM512 872L135.6 220L888.4 220Z"
        stroke="currentColor"
        stroke-width="60"
      />
      <path
        d="M512 439.3L83.6 190L940.4 190ZM512 873.1L387.3 441.1L512 561L636.7 441.1ZM512 967.5L574.4 868L784 750.6L857.9 868L512 1024L166.2 868L240 750.6L449.6 868Z"
        fill="currentColor"
      />
    </svg>
    <div class="bar-track">
      <div class="bar-fill"></div>
    </div>
  </body>
</html>
