name: Release Build

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  validate-release:
    name: Validate Release Identity
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate tag and embedded versions
        run: python3 scripts/validate-release-version.py "${{ github.ref_name }}"

  create-release:
    name: Create Draft Release
    needs: validate-release
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Create the draft release once up front so the parallel build jobs only
      # upload assets to it. Creating it inside each build job races and can fail
      # with a 422 conflict when jobs start at the same time.
      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          repo="${{ github.repository }}"
          if ! gh release view "$tag" -R "$repo" >/dev/null 2>&1; then
            args=(--draft --title "$tag" --notes "")
            if [[ "$tag" == *-* ]]; then
              args+=(--prerelease)
            fi
            gh release create "$tag" -R "$repo" "${args[@]}"
          fi
          # The `releases/tags/{tag}` API hides drafts, so read the id via the
          # gh CLI which can see drafts created by this token.
          release_id="$(gh release view "$tag" -R "$repo" --json databaseId -q '.databaseId')"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  # Ensures the WebRTC-enabled WebKitGTK tarballs exist before the Linux
  # builds bundle them. No-ops in seconds when already published; only the
  # first release after a webkit version bump pays the ~4h build.
  webkitgtk:
    name: WebKitGTK (WebRTC)
    needs: validate-release
    uses: ./.github/workflows/build-webkitgtk.yaml
    permissions:
      packages: write
    with:
      version: 2.48.7

  build-binary:
    name: Build Binaries
    needs: [create-release, webkitgtk]
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: ubuntu-24.04
          - platform: ubuntu-24.04-arm
          - platform: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set bun hash
        shell: bash
        run: |
          if [ -f bun.lock ]; then
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              HASH=$(shasum -a 256 bun.lock | cut -d' ' -f1)
            else
              HASH=$(sha256sum bun.lock | cut -d' ' -f1)
            fi
            echo "BUN_HASH=$HASH" >> $GITHUB_ENV
          else
            echo "BUN_HASH=no-lock" >> $GITHUB_ENV
          fi

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ env.BUN_HASH }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Install macOS dependencies
        if: matrix.platform == 'macos-latest'
        run: |
          brew install ffmpeg
          for pkg in ffmpeg $(brew deps ffmpeg); do
            pkg_lib="$(brew --prefix "$pkg")/lib"
            [ -d "$pkg_lib" ] || continue
            for dylib in "$pkg_lib"/*.dylib; do
              [ -L "$dylib" ] && continue
              [ -f "$dylib" ] || continue
              install_name_tool -id "@rpath/$(basename "$dylib")" "$dylib"
              for dep in $(otool -L "$dylib" | grep /opt/homebrew | awk '{print $1}'); do
                install_name_tool -change "$dep" "@rpath/$(basename "$dep")" "$dylib"
              done
            done
            cp -P "$pkg_lib"/*.dylib src-tauri/ 2>/dev/null || true
          done
          DYLIBS_JSON=$(ls src-tauri/*.dylib | sed 's|src-tauri/|./|' | sed 's|^|"|' | sed 's|$|"|' | tr '\n' ',' | sed 's/,$//')
          bun -e "console.log(JSON.stringify({bundle: {macOS: {frameworks: [$DYLIBS_JSON]}}}))" > src-tauri/tauri.macos.conf.json

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04' || matrix.platform == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            pkg-config \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libswscale-dev \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            gstreamer1.0-nice \
            xdg-utils \
            patchelf
          # Runtime deps of the bundled WebKitGTK: the AppImage bundler
          # (linuxdeploy) resolves every NEEDED of the webkit resource tree
          # on this host and hard-fails on any it cannot find.
          sudo apt-get install -y \
            libwoff1 \
            libjxl0.7 \
            libavif16 \
            libenchant-2-2 \
            libsecret-1-0 \
            libhyphen0 \
            libmanette-0.2-0

      - name: Download WebRTC-enabled WebKitGTK
        if: matrix.platform == 'ubuntu-24.04' || matrix.platform == 'ubuntu-24.04-arm'
        shell: bash
        env:
          WEBKITGTK_VERSION: ${{ needs.webkitgtk.outputs.version }}
        run: |
          set -euo pipefail
          # Distro WebKitGTK has no WebRTC compiled in, so the packages ship
          # our own build (published by the webkitgtk job to GitHub Packages)
          # under <resources>/webkit. The app binary's rpath prefers it.
          case "$(uname -m)" in
            x86_64) oras_arch=amd64 ;;
            aarch64) oras_arch=arm64 ;;
          esac
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v1.3.2/oras_1.3.2_linux_${oras_arch}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin oras
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras pull "ghcr.io/${{ github.repository_owner }}/webkitgtk-webrtc:${WEBKITGTK_VERSION}-$(uname -m)"
          mkdir -p src-tauri/webkit
          tar -C src-tauri/webkit --strip-components=1 -I zstd \
            -xf "webkitgtk-${WEBKITGTK_VERSION}-webrtc-$(uname -m).tar.zst"
          rm "webkitgtk-${WEBKITGTK_VERSION}-webrtc-$(uname -m).tar.zst"

      - name: Bundle FFmpeg and WebKitGTK libraries
        if: matrix.platform == 'ubuntu-24.04' || matrix.platform == 'ubuntu-24.04-arm'
        shell: bash
        run: |
          set -euo pipefail
          # Bundle FFmpeg and its full dependency closure so the package works
          # across distro versions. The denylist holds everything that must
          # come from the host instead: the GTK/WebKit/GL desktop stack,
          # libsoup (loads host gio modules), libgst* (must match the host's
          # gstreamer plugins, pulled in via the deb/rpm Depends) and
          # libssl/libcrypto (host gst plugins like gstdtls link the host
          # openssl pair; pinning an older bundled libcrypto breaks the
          # symbol-versioning contract and crashes WebRTC's DTLS path).
          triplet="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          libdir="/usr/lib/${triplet}"
          deny='^(ld-linux|libc\.|libm\.|libdl\.|libpthread\.|librt\.|libgcc_s\.|libstdc\+\+|libz\.|libresolv|libselinux|libpcre|libffi|libuuid|libmount|libblkid|libsystemd|libcap|libgcrypt|libgpg-error|libglib-2|libgobject-2|libgio-2|libgmodule-2|libgthread|libgtk-3|libgdk-3|libgdk_pixbuf|libwebkit2gtk|libjavascriptcoregtk|libsoup|libgst|libssl|libcrypto|libcairo|libcairo-gobject|libpango|libpangocairo|libpangoft2|libharfbuzz|libfontconfig|libfreetype|libexpat|libpng|libpixman|libgraphite|libthai|libdatrie|libfribidi|libepoxy|libGL|libOpenGL|libEGL|libGLX|libGLdispatch|libGLU|libgbm|libdrm|libva|libvdpau|libwayland|libX11|libxcb|libXext|libXfixes|libXrender|libXi|libXrandr|libXcursor|libXcomposite|libXdamage|libXinerama|libXxf86vm|libXau|libXdmcp|libxkbcommon|libxshmfence|libxcb-|librsvg|libgmodule|libatk|libatspi|libdbus)'

          copy_soname() {
            # Name the copy by its real ELF SONAME - the exact name the loader
            # requests. Guessing from the filename breaks on multi-part majors
            # like libjxl.so.0.7.
            local src="$1"
            local real soname
            real="$(readlink -f "$src")"
            soname="$(patchelf --print-soname "$real" 2>/dev/null || true)"
            [ -n "$soname" ] || soname="$(basename "$real")"
            cp -Lf "$real" "src-tauri/${soname}"
          }

          # BFS over the dependency closure; a one-level walk would miss
          # transitive deps such as libjxl's own libbrotli/libhwy.
          declare -A seen=()
          queue=()
          for f in "${libdir}"/libav*.so.* "${libdir}"/libsw*.so.*; do
            [ -e "$f" ] || continue
            queue+=("$f")
          done
          # Also seed with the bundled WebKitGTK's third-party deps (icu, webp,
          # woff2, ...); the webkit files themselves ship as the webkit/ tree.
          while read -r wk; do
            while read -r dep; do
              dbase="$(basename "$dep")"
              if [ -e "$dep" ] && ! echo "$dbase" | grep -Eq "$deny"; then
                queue+=("$dep")
              fi
            done < <(ldd "$wk" 2>/dev/null | awk '/=> \//{print $3}')
          done < <(find src-tauri/webkit/lib src-tauri/webkit/libexec -type f \( -name '*.so*' -o -perm -u+x \) 2>/dev/null)
          while [ "${#queue[@]}" -gt 0 ]; do
            cur="${queue[0]}"
            queue=("${queue[@]:1}")
            base="$(basename "$(readlink -f "$cur")")"
            if [ -n "${seen[$base]:-}" ]; then
              continue
            fi
            seen[$base]=1
            copy_soname "$cur"
            while read -r dep; do
              dbase="$(basename "$dep")"
              if [ -e "$dep" ] && ! echo "$dbase" | grep -Eq "$deny"; then
                queue+=("$dep")
              fi
            done < <(ldd "$cur" 2>/dev/null | awk '/=> \//{print $3}')
          done
          # $ORIGIN rpath lets the bundled libs find their siblings; the app
          # binary's DT_RUNPATH does not apply to transitive loads.
          for f in src-tauri/*.so*; do
            [ -e "$f" ] || continue
            patchelf --set-rpath '$ORIGIN' "$f" || true
          done
          # Wire the webkit tree to its own libs and the resource root.
          # Relative $ORIGIN paths cover the installed tree and the AppImage;
          # the absolute paths are a fallback for helpers that get copied out
          # by the exec-bit recovery in the app.
          for f in src-tauri/webkit/lib/*.so*; do
            [ -f "$f" ] || continue
            patchelf --set-rpath '$ORIGIN:$ORIGIN/../..' "$f" || true
          done
          for f in src-tauri/webkit/libexec/webkit2gtk-4.1/*; do
            [ -f "$f" ] || continue
            patchelf --set-rpath '$ORIGIN/../../lib:$ORIGIN/../../..:/usr/lib/Manafish/webkit/lib:/usr/lib/Manafish' "$f" || true
          done
          for f in src-tauri/webkit/lib/webkit2gtk-4.1/injected-bundle/*.so*; do
            [ -f "$f" ] || continue
            patchelf --set-rpath '$ORIGIN/../..:$ORIGIN/../../../..' "$f" || true
          done
          echo '{"bundle": {"resources": ["*.so*", "webkit"]}}' > src-tauri/tauri.linux.conf.json

      - name: Install Windows dependencies
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          $VCINSTALLDIR = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -property installationPath
          Add-Content $env:GITHUB_ENV "LIBCLANG_PATH=$VCINSTALLDIR\VC\Tools\LLVM\x64\bin`n"
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-full_build-shared.7z"
          Invoke-WebRequest $url -OutFile ffmpeg-release-full-shared.7z
          7z x ffmpeg-release-full-shared.7z
          mkdir ffmpeg
          mv ffmpeg-*/* ffmpeg/
          Add-Content $env:GITHUB_ENV "FFMPEG_DIR=${pwd}\ffmpeg`n"
          copy-item "ffmpeg\bin\*.dll" src-tauri/
          Set-Content src-tauri/tauri.windows.conf.json '{"bundle": {"resources": ["*.dll"]}}'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # The updater key authenticates update archives, but Windows reputation
      # requires Authenticode. Import the product certificate and configure
      # Tauri with its actual thumbprint so both the app and installer are
      # signed by the release build.
      - name: Import Windows code-signing certificate
        if: matrix.platform == 'windows-latest'
        shell: powershell
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            throw 'WINDOWS_CERTIFICATE must contain the base64-encoded PFX certificate.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'WINDOWS_CERTIFICATE_PASSWORD must contain the PFX password.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) {
            throw 'WINDOWS_TIMESTAMP_URL must contain the certificate issuer timestamp URL.'
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'manafish-windows-signing.pfx'
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          )
          $password = ConvertTo-SecureString `
            -String $env:WINDOWS_CERTIFICATE_PASSWORD `
            -Force `
            -AsPlainText
          try {
            $certificate = @(
              Import-PfxCertificate `
                -FilePath $certificatePath `
                -CertStoreLocation Cert:\CurrentUser\My `
                -Password $password
            ) | Where-Object HasPrivateKey | Select-Object -First 1
          } finally {
            Remove-Item -Force $certificatePath -ErrorAction SilentlyContinue
          }
          if ($null -eq $certificate) {
            throw 'The imported Windows certificate does not contain a private key.'
          }

          $configPath = 'src-tauri/tauri.windows.conf.json'
          $config = Get-Content -Raw $configPath | ConvertFrom-Json
          if ($null -eq $config.bundle.windows) {
            $config.bundle | Add-Member `
              -NotePropertyName windows `
              -NotePropertyValue ([PSCustomObject]@{}) `
              -Force
          }
          $config.bundle.windows | Add-Member `
            -NotePropertyName certificateThumbprint `
            -NotePropertyValue $certificate.Thumbprint `
            -Force
          $config.bundle.windows | Add-Member `
            -NotePropertyName digestAlgorithm `
            -NotePropertyValue 'sha256' `
            -Force
          $config.bundle.windows | Add-Member `
            -NotePropertyName timestampUrl `
            -NotePropertyValue $env:WINDOWS_TIMESTAMP_URL `
            -Force
          $config | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 $configPath

      - name: Import Apple Developer certificate
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/apple-certificate.p12"
          keychain_path="$RUNNER_TEMP/build.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A -out "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Prepare Apple notarization key
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail

          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$api_key_path"
          chmod 600 "$api_key_path"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      # macOS: direct downloads own their own updates, and must be Developer ID
      # signed and notarized so Gatekeeper accepts the downloaded app.
      - name: Build and upload macOS to draft release
        if: matrix.platform == 'macos-latest'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          VITE_FIRMWARE_UPDATE_MANIFEST_URL: ${{ vars.FIRMWARE_UPDATE_MANIFEST_URL }}
          CMAKE_POLICY_VERSION_MINIMUM: 3.5
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}

      # Windows: direct downloads own their own updates.
      - name: Build and upload Windows to draft release
        if: matrix.platform == 'windows-latest'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          VITE_FIRMWARE_UPDATE_MANIFEST_URL: ${{ vars.FIRMWARE_UPDATE_MANIFEST_URL }}
          CMAKE_POLICY_VERSION_MINIMUM: 3.5
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}

      # Linux deb/rpm: package-manager owned, so the in-app updater is
      # compiled out (it can only replace an AppImage in place; touching a
      # dpkg/rpm-managed binary would desync the package database).
      - name: Build and upload deb/rpm
        if: matrix.platform == 'ubuntu-24.04' || matrix.platform == 'ubuntu-24.04-arm'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          VITE_FIRMWARE_UPDATE_MANIFEST_URL: ${{ vars.FIRMWARE_UPDATE_MANIFEST_URL }}
          CMAKE_POLICY_VERSION_MINIMUM: 3.5
          MANAFISH_UPDATER_DISABLED: '1'
          VITE_UPDATER_DISABLED: '1'
          LD_LIBRARY_PATH: ${{ github.workspace }}/src-tauri/webkit/lib
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --bundles deb,rpm

      # Linux AppImage: a direct download, so the in-app updater stays on.
      # LD_LIBRARY_PATH makes the AppImage bundler resolve libwebkit2gtk to
      # OUR WebRTC build instead of the host one (which AppRun would otherwise
      # shadow it with, losing WebRTC).
      - name: Build and upload AppImage
        if: matrix.platform == 'ubuntu-24.04' || matrix.platform == 'ubuntu-24.04-arm'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          VITE_FIRMWARE_UPDATE_MANIFEST_URL: ${{ vars.FIRMWARE_UPDATE_MANIFEST_URL }}
          CMAKE_POLICY_VERSION_MINIMUM: 3.5
          LD_LIBRARY_PATH: ${{ github.workspace }}/src-tauri/webkit/lib
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --bundles appimage
