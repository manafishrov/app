name: Release Build

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  create-release:
    name: Create Draft Release
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # Create the draft release once up front so the parallel build jobs only
      # upload assets to it. Creating it inside each build job races and can fail
      # with a 422 conflict when jobs start at the same time.
      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          repo="${{ github.repository }}"
          if ! gh release view "$tag" -R "$repo" >/dev/null 2>&1; then
            args=(--draft --title "$tag" --notes "Release assets for $tag.")
            if [[ "$tag" == *-* ]]; then
              args+=(--prerelease)
            fi
            gh release create "$tag" -R "$repo" "${args[@]}"
          fi
          # The `releases/tags/{tag}` API hides drafts, so read the id via the
          # gh CLI which can see drafts created by this token.
          release_id="$(gh release view "$tag" -R "$repo" --json databaseId -q '.databaseId')"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build-binary:
    name: Build Binaries
    needs: create-release
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: ubuntu-24.04
          - platform: ubuntu-24.04-arm
          - platform: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set bun hash
        shell: bash
        run: |
          if [ -f bun.lock ]; then
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              HASH=$(shasum -a 256 bun.lock | cut -d' ' -f1)
            else
              HASH=$(sha256sum bun.lock | cut -d' ' -f1)
            fi
            echo "BUN_HASH=$HASH" >> $GITHUB_ENV
          else
            echo "BUN_HASH=no-lock" >> $GITHUB_ENV
          fi

      - name: Cache bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ env.BUN_HASH }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install macOS dependencies
        if: matrix.platform == 'macos-latest'
        run: |
          brew install ffmpeg
          for pkg in ffmpeg $(brew deps ffmpeg); do
            pkg_lib="$(brew --prefix "$pkg")/lib"
            [ -d "$pkg_lib" ] || continue
            for dylib in "$pkg_lib"/*.dylib; do
              [ -L "$dylib" ] && continue
              [ -f "$dylib" ] || continue
              install_name_tool -id "@rpath/$(basename "$dylib")" "$dylib"
              for dep in $(otool -L "$dylib" | grep /opt/homebrew | awk '{print $1}'); do
                install_name_tool -change "$dep" "@rpath/$(basename "$dep")" "$dylib"
              done
            done
            cp -P "$pkg_lib"/*.dylib src-tauri/ 2>/dev/null || true
          done
          DYLIBS_JSON=$(ls src-tauri/*.dylib | sed 's|src-tauri/|./|' | sed 's|^|"|' | sed 's|$|"|' | tr '\n' ',' | sed 's/,$//')
          bun -e "console.log(JSON.stringify({bundle: {macOS: {frameworks: [$DYLIBS_JSON]}}}))" > src-tauri/tauri.macos.conf.json

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04' || matrix.platform == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            pkg-config \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libswscale-dev \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            gstreamer1.0-nice \
            xdg-utils \
            patchelf

      - name: Download WebRTC-enabled WebKitGTK
        if: matrix.platform == 'ubuntu-24.04' || matrix.platform == 'ubuntu-24.04-arm'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBKITGTK_VERSION: 2.48.7
        run: |
          set -euo pipefail
          # Distro WebKitGTK builds compile without ENABLE_WEB_RTC, leaving
          # RTCPeerConnection undefined in the webview. Bundle our own build
          # (from the build-webkitgtk.yaml workflow) so the live video feed
          # works everywhere. Installed under <resources>/webkit; the app
          # binary's rpath prefers webkit/lib over the host library.
          gh release download "webkitgtk-${WEBKITGTK_VERSION}-webrtc" \
            -R "${{ github.repository }}" \
            --pattern "webkitgtk-${WEBKITGTK_VERSION}-webrtc-$(uname -m).tar.zst"
          mkdir -p src-tauri/webkit
          tar -C src-tauri/webkit --strip-components=1 -I zstd \
            -xf "webkitgtk-${WEBKITGTK_VERSION}-webrtc-$(uname -m).tar.zst"
          rm "webkitgtk-${WEBKITGTK_VERSION}-webrtc-$(uname -m).tar.zst"

      - name: Bundle FFmpeg and WebKitGTK libraries
        if: matrix.platform == 'ubuntu-24.04' || matrix.platform == 'ubuntu-24.04-arm'
        shell: bash
        run: |
          set -euo pipefail
          # Bundle the FFmpeg libraries and their full dependency closure
          # so the package is self-contained across distro versions. Use a denylist
          # of the desktop/GPU/font/core libraries that must come from the host
          # (bundling those would conflict with the system GTK/WebKit/GL stack);
          # everything else FFmpeg links directly is a codec/helper lib we bundle.
          triplet="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          libdir="/usr/lib/${triplet}"
          # libsoup and libgst* must come from the host: libsoup loads host
          # glib-networking gio modules and gst core must match the host's
          # gstreamer plugins (webrtcbin etc. come from the deb/rpm Depends).
          deny='^(ld-linux|libc\.|libm\.|libdl\.|libpthread\.|librt\.|libgcc_s\.|libstdc\+\+|libz\.|libresolv|libselinux|libpcre|libffi|libuuid|libmount|libblkid|libsystemd|libcap|libgcrypt|libgpg-error|libglib-2|libgobject-2|libgio-2|libgmodule-2|libgthread|libgtk-3|libgdk-3|libgdk_pixbuf|libwebkit2gtk|libjavascriptcoregtk|libsoup|libgst|libcairo|libcairo-gobject|libpango|libpangocairo|libpangoft2|libharfbuzz|libfontconfig|libfreetype|libexpat|libpng|libpixman|libgraphite|libthai|libdatrie|libfribidi|libepoxy|libGL|libOpenGL|libEGL|libGLX|libGLdispatch|libGLU|libgbm|libdrm|libva|libvdpau|libwayland|libX11|libxcb|libXext|libXfixes|libXrender|libXi|libXrandr|libXcursor|libXcomposite|libXdamage|libXinerama|libXxf86vm|libXau|libXdmcp|libxkbcommon|libxshmfence|libxcb-|librsvg|libgmodule|libatk|libatspi|libdbus)'

          copy_soname() {
            # Name the bundled file by its real ELF SONAME (the exact name the
            # loader requests), not a guessed suffix. SONAMEs are not always a
            # single integer major (e.g. libjxl.so.0.7), so deriving the name
            # from the filename with a regex misnames the file and the loader
            # then fails with "cannot open shared object file".
            local src="$1"
            local real soname
            real="$(readlink -f "$src")"
            soname="$(patchelf --print-soname "$real" 2>/dev/null || true)"
            [ -n "$soname" ] || soname="$(basename "$real")"
            cp -Lf "$real" "src-tauri/${soname}"
          }

          # Recursively bundle the FFmpeg libraries and their entire dependency
          # closure (deps-of-deps included), skipping anything on the denylist
          # which must come from the host. A one-level walk misses transitive
          # deps such as libjxl's own libbrotli/libhwy.
          declare -A seen=()
          queue=()
          for f in "${libdir}"/libav*.so.* "${libdir}"/libsw*.so.*; do
            [ -e "$f" ] || continue
            queue+=("$f")
          done
          # Seed the walk with the bundled WebKitGTK's third-party deps (icu,
          # webp, woff2, ...) so they land in the resource root too. The webkit
          # files themselves are shipped as the webkit/ tree, not copied here;
          # ldd resolves their deps against the build host's packages.
          if [ -d src-tauri/webkit ]; then
            while read -r wk; do
              while read -r dep; do
                dbase="$(basename "$dep")"
                if [ -e "$dep" ] && ! echo "$dbase" | grep -Eq "$deny"; then
                  queue+=("$dep")
                fi
              done < <(ldd "$wk" 2>/dev/null | awk '/=> \//{print $3}')
            done < <(find src-tauri/webkit/lib src-tauri/webkit/libexec -type f \( -name '*.so*' -o -perm -u+x \) 2>/dev/null)
          fi
          while [ "${#queue[@]}" -gt 0 ]; do
            cur="${queue[0]}"
            queue=("${queue[@]:1}")
            base="$(basename "$(readlink -f "$cur")")"
            if [ -n "${seen[$base]:-}" ]; then
              continue
            fi
            seen[$base]=1
            copy_soname "$cur"
            while read -r dep; do
              dbase="$(basename "$dep")"
              if [ -e "$dep" ] && ! echo "$dbase" | grep -Eq "$deny"; then
                queue+=("$dep")
              fi
            done < <(ldd "$cur" 2>/dev/null | awk '/=> \//{print $3}')
          done
          # Give each bundled library an $ORIGIN rpath so they find their
          # siblings. The loader's DT_RUNPATH does not apply to transitive deps
          # (e.g. libavformat needs libavutil), so without this the bundled libs
          # cannot locate each other even though they sit in the same directory.
          for f in src-tauri/*.so*; do
            [ -e "$f" ] || continue
            patchelf --set-rpath '$ORIGIN' "$f" || true
          done
          # Wire the bundled WebKitGTK tree to its own libs (webkit/lib) and to
          # the resource root (icu etc.). Relative $ORIGIN paths work in the
          # installed tree and the AppImage; the absolute path is a fallback for
          # helper binaries that had to be copied out (exec-bit recovery).
          if [ -d src-tauri/webkit ]; then
            for f in src-tauri/webkit/lib/*.so*; do
              [ -f "$f" ] || continue
              patchelf --set-rpath '$ORIGIN:$ORIGIN/../..' "$f" || true
            done
            for f in src-tauri/webkit/libexec/webkit2gtk-4.1/*; do
              [ -f "$f" ] || continue
              patchelf --set-rpath '$ORIGIN/../../lib:$ORIGIN/../../..:/usr/lib/Manafish/webkit/lib:/usr/lib/Manafish' "$f" || true
            done
            for f in src-tauri/webkit/lib/webkit2gtk-4.1/injected-bundle/*.so*; do
              [ -f "$f" ] || continue
              patchelf --set-rpath '$ORIGIN/../..:$ORIGIN/../../../..' "$f" || true
            done
            echo '{"bundle": {"resources": ["*.so*", "webkit"]}}' > src-tauri/tauri.linux.conf.json
          else
            echo '{"bundle": {"resources": ["*.so*"]}}' > src-tauri/tauri.linux.conf.json
          fi

      - name: Install Windows dependencies
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          $VCINSTALLDIR = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -property installationPath
          Add-Content $env:GITHUB_ENV "LIBCLANG_PATH=$VCINSTALLDIR\VC\Tools\LLVM\x64\bin`n"
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-full_build-shared.7z"
          Invoke-WebRequest $url -OutFile ffmpeg-release-full-shared.7z
          7z x ffmpeg-release-full-shared.7z
          mkdir ffmpeg
          mv ffmpeg-*/* ffmpeg/
          Add-Content $env:GITHUB_ENV "FFMPEG_DIR=${pwd}\ffmpeg`n"
          copy-item "ffmpeg\bin\*.dll" src-tauri/
          Set-Content src-tauri/tauri.windows.conf.json '{"bundle": {"resources": ["*.dll"]}}'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and upload to draft release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          VITE_FIRMWARE_UPDATE_MANIFEST_URL: ${{ vars.FIRMWARE_UPDATE_MANIFEST_URL }}
          CMAKE_POLICY_VERSION_MINIMUM: 3.5
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
