name: Release Build

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-binary:
    name: Build Binaries
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: ubuntu-22.04
          - platform: ubuntu-22.04-arm
          - platform: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set bun hash
        shell: bash
        run: |
          if [ -f bun.lock ]; then
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              HASH=$(shasum -a 256 bun.lock | cut -d' ' -f1)
            else
              HASH=$(sha256sum bun.lock | cut -d' ' -f1)
            fi
            echo "BUN_HASH=$HASH" >> $GITHUB_ENV
          else
            echo "BUN_HASH=no-lock" >> $GITHUB_ENV
          fi

      - name: Cache bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ env.BUN_HASH }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install macOS dependencies
        if: matrix.platform == 'macos-latest'
        run: |
          brew install ffmpeg
          for pkg in ffmpeg $(brew deps ffmpeg); do
            pkg_lib="$(brew --prefix "$pkg")/lib"
            [ -d "$pkg_lib" ] || continue
            for dylib in "$pkg_lib"/*.dylib; do
              [ -L "$dylib" ] && continue
              [ -f "$dylib" ] || continue
              install_name_tool -id "@rpath/$(basename "$dylib")" "$dylib"
              for dep in $(otool -L "$dylib" | grep /opt/homebrew | awk '{print $1}'); do
                install_name_tool -change "$dep" "@rpath/$(basename "$dep")" "$dylib"
              done
            done
            cp -P "$pkg_lib"/*.dylib src-tauri/ 2>/dev/null || true
          done
          DYLIBS_JSON=$(ls src-tauri/*.dylib | sed 's|src-tauri/|./|' | sed 's|^|"|' | sed 's|$|"|' | tr '\n' ',' | sed 's/,$//')
          bun -e "console.log(JSON.stringify({bundle: {macOS: {frameworks: [$DYLIBS_JSON]}}}))" > src-tauri/tauri.macos.conf.json

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-22.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            pkg-config \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libswscale-dev \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            gstreamer1.0-nice
          # Multiarch triplet differs per arch (x86_64-linux-gnu vs aarch64-linux-gnu).
          ARCH_TRIPLET="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          cp -P "/usr/lib/${ARCH_TRIPLET}"/libavcodec*.so* src-tauri/
          cp -P "/usr/lib/${ARCH_TRIPLET}"/libavdevice*.so* src-tauri/
          cp -P "/usr/lib/${ARCH_TRIPLET}"/libavfilter*.so* src-tauri/
          cp -P "/usr/lib/${ARCH_TRIPLET}"/libavformat*.so* src-tauri/
          cp -P "/usr/lib/${ARCH_TRIPLET}"/libavutil*.so* src-tauri/
          cp -P "/usr/lib/${ARCH_TRIPLET}"/libsw*.so* src-tauri/
          echo '{"bundle": {"resources": ["*.so*", "*.so"]}}' > src-tauri/tauri.linux.conf.json

      - name: Install Windows dependencies
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          $VCINSTALLDIR = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -property installationPath
          Add-Content $env:GITHUB_ENV "LIBCLANG_PATH=$VCINSTALLDIR\VC\Tools\LLVM\x64\bin`n"
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-full_build-shared.7z"
          Invoke-WebRequest $url -OutFile ffmpeg-release-full-shared.7z
          7z x ffmpeg-release-full-shared.7z
          mkdir ffmpeg
          mv ffmpeg-*/* ffmpeg/
          Add-Content $env:GITHUB_ENV "FFMPEG_DIR=${pwd}\ffmpeg`n"
          copy-item "ffmpeg\bin\*.dll" src-tauri/
          Set-Content src-tauri/tauri.windows.conf.json '{"bundle": {"resources": ["*.dll"]}}'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and create draft release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_FIRMWARE_UPDATE_MANIFEST_URL: ${{ vars.FIRMWARE_UPDATE_MANIFEST_URL }}
          CMAKE_POLICY_VERSION_MINIMUM: 3.5
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: 'Release assets for ${{ github.ref_name }}.'
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
