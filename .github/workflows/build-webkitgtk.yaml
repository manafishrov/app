name: Build WebKitGTK (WebRTC)

# Builds WebKitGTK with ENABLE_WEB_RTC, which every distro compiles out -
# leaving RTCPeerConnection undefined and breaking the live video feed.
# Tarballs are pushed to the ghcr.io/<owner>/webkitgtk-webrtc package
# (NOT a GitHub release: releases would clutter the repo's tags/releases
# and shadow the Tauri updater's releases/latest endpoint) and build.yaml
# bundles them into the Linux packages.
#
# Called from the release workflow on every tag: no-ops in seconds when the
# tarball exists, so only the first release after a version bump pays the
# ~4h build. Manual dispatch is for CVE rebuilds.
#
# One-time setup after the first push: set the package visibility to public
# in the GitHub UI so non-CI consumers can pull it anonymously.
#
# ENABLE_DEVELOPER_MODE makes WebKit honor WEBKIT_EXEC_PATH so the helper
# binaries can live inside our package instead of /usr/libexec.

on:
  workflow_dispatch:
    inputs:
      version:
        description: WebKitGTK version to build
        required: true
        default: 2.48.7
  workflow_call:
    inputs:
      version:
        description: WebKitGTK version to build
        required: true
        type: string
    outputs:
      version:
        description: The WebKitGTK version that was ensured
        value: ${{ inputs.version }}

permissions:
  packages: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            arch: x86_64
          - platform: ubuntu-24.04-arm
            arch: aarch64

    steps:
      - name: Install oras
        run: |
          case "$(uname -m)" in
            x86_64) oras_arch=amd64 ;;
            aarch64) oras_arch=arm64 ;;
          esac
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v1.3.2/oras_1.3.2_linux_${oras_arch}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin oras
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Skip when tarball already published
        id: check
        run: |
          ref="ghcr.io/${{ github.repository_owner }}/webkitgtk-webrtc:${{ inputs.version }}-$(uname -m)"
          if oras manifest fetch "$ref" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$ref already published; skipping build"
          fi

      - name: Free disk space
        if: steps.check.outputs.exists != 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build dependencies
        if: steps.check.outputs.exists != 'true'
        run: |
          # build-dep needs deb-src entries, which the runners disable.
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get build-dep -y webkit2gtk
          # libssl-dev: WebRTC needs OpenSSL 3, absent from the build-deps
          # because the distro build compiles WebRTC out.
          sudo apt-get install -y ninja-build ccache lld unifdef \
            libgstreamer-plugins-bad1.0-dev libnice-dev libssl-dev

      - name: Restore ccache
        if: steps.check.outputs.exists != 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ccache
          key: webkitgtk-ccache-${{ matrix.arch }}-${{ inputs.version }}
          restore-keys: |
            webkitgtk-ccache-${{ matrix.arch }}-

      - name: Download WebKitGTK source
        if: steps.check.outputs.exists != 'true'
        run: |
          curl -fLO "https://webkitgtk.org/releases/webkitgtk-${{ inputs.version }}.tar.xz"
          curl -fLO "https://webkitgtk.org/releases/webkitgtk-${{ inputs.version }}.tar.xz.sums"
          sha256=$(grep -Eo '^[0-9a-f]{64}' webkitgtk-${{ inputs.version }}.tar.xz.sums | head -1 || true)
          if [ -n "$sha256" ]; then
            echo "${sha256}  webkitgtk-${{ inputs.version }}.tar.xz" | sha256sum -c -
          fi
          tar xf "webkitgtk-${{ inputs.version }}.tar.xz"

      - name: Configure
        if: steps.check.outputs.exists != 'true'
        working-directory: webkitgtk-${{ inputs.version }}
        run: |
          # Prefix matches where the deb/rpm install the resource dir, so the
          # compiled-in helper paths resolve without env overrides there.
          # Speech synthesis (needs flite) and libbacktrace (not packaged on
          # noble) are off; neither is useful to this app.
          cmake -B build -G Ninja \
            -DPORT=GTK \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/lib/Manafish/webkit \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
            -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld \
            -DCMAKE_MODULE_LINKER_FLAGS=-fuse-ld=lld \
            -DUSE_GTK4=OFF \
            -DENABLE_WEB_RTC=ON \
            -DENABLE_DEVELOPER_MODE=ON \
            -DENABLE_BUBBLEWRAP_SANDBOX=OFF \
            -DENABLE_MINIBROWSER=OFF \
            -DENABLE_DOCUMENTATION=OFF \
            -DENABLE_INTROSPECTION=OFF \
            -DENABLE_SPEECH_SYNTHESIS=OFF \
            -DUSE_LIBBACKTRACE=OFF

      - name: Build
        if: steps.check.outputs.exists != 'true'
        working-directory: webkitgtk-${{ inputs.version }}
        run: |
          ccache --zero-stats
          ninja -C build
          ccache --show-stats

      - name: Package
        if: steps.check.outputs.exists != 'true'
        working-directory: webkitgtk-${{ inputs.version }}
        run: |
          DESTDIR="$PWD/dest" ninja -C build install
          tar -C dest/usr/lib/Manafish -I 'zstd -19 -T0' \
            -cf "../webkitgtk-${{ inputs.version }}-webrtc-${{ matrix.arch }}.tar.zst" webkit

      - name: Push to GitHub Packages
        if: steps.check.outputs.exists != 'true'
        run: |
          # The source annotation links the package to this repository.
          oras push \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            "ghcr.io/${{ github.repository_owner }}/webkitgtk-webrtc:${{ inputs.version }}-${{ matrix.arch }}" \
            "webkitgtk-${{ inputs.version }}-webrtc-${{ matrix.arch }}.tar.zst"
