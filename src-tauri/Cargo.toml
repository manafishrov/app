[package]
name = "manafish-app"
description = "An app for controlling the Manafish ROV"
version = "1.0.11"
license = "AGPL-3.0-or-later"
authors = ["Michael Brusegard"]
edition = "2024"
rust-version = "1.92"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
float_cmp = "warn"
mutex_atomic = "warn"
redundant_clone = "warn"
wildcard_dependencies = "deny"

[lib]
name = "manafish_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
tauri = { version = "2.9.5", features = ["macos-private-api"] }
tauri-plugin-updater = "2.9.0"
tauri-plugin-opener = "2.5.3"
tauri-plugin-dialog = "2.5.0"
tauri-plugin-fs = "2.4.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
dirs = "6.0.0"
reqwest = { version = "0.13.0", default-features = false, features = ["json", "rustls", "stream"] }
sha2 = "0.11.0"
minisign-verify = "0.2.4"
tokio = { version = "1.49.0", features = ["full"] }
tokio-tungstenite = "0.29.0"
tokio-util = { version = "0.7.17", features = ["io"] }
futures-util = "0.3.31"
bytes = "1.10.1"
ruzstd = "0.8.0"
runas = "1.2.0"
tempfile = "3.21.0"
sdl2 = { version = "0.38.0", features = ["bundled", "static-link"] }
ffmpeg-next = "8.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.181"
plist = "1.7.4"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.181"
nix = { version = "0.31.0", features = ["mount"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Ioctl", "Win32_System_IO"] }
