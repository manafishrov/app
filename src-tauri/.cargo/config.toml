# ffmpeg-sys-next's build script overflows Windows' default 1 MiB main-thread
# stack while generating bindings. Without `--target`, these flags also apply
# to build scripts, so reserve the 8 MiB stack Linux and macOS already give.
# https://github.com/zmwangx/rust-ffmpeg-sys/issues/9
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608"]

[env]
# Match the pinned ONNX Runtime archive and the app's iOS deployment target.
# Direct Cargo checks do not load tauri.ios.conf.json.
IPHONEOS_DEPLOYMENT_TARGET = "15.1"
# Bundled SDL2 still declares policies older than CMake 4 accepts by default.
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
